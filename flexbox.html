<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        justify-content: space-around;
      }
      .box {
        width: 200px;
        height: 150px;
        font-size: 20px;
        border: 1px solid blue;
        border-radius: 5%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">Study</div>
      <div class="box">Fun</div>
      <div class="box">Entertainment</div>
    </div>
    <div class="container">
      <div class="box">Structure</div>
      <div class="box">Funist</div>
      <div class="box">Entertainment to other</div>
    </div>
  </body>
</html>
