<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @keyframes slidein {
        0% {
          left: 0;
          top: 10px;
          background-color: blue;
        }
        50%{
            left: 0;
            top: 100px;
            background-color: red;
        }
        100%{
            left: 800px;
            top: 100px;
            background-color: rgb(69, 190, 96);
        }
      }
      .ball {
        width: 80px;
        height: 80px;
        background-color: blue;
        border-radius: 50%;
        position: absolute;
      }
      .stage {
        height: 200px;
        min-width: 800px;
        background-color: rgb(170, 213, 213);
      }
        .stage:hover .ball {
            animation: slidein 3s ease-in-out 1s  infinite alternate;
        }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ball"></div>
    </div>
  </body>
</html>
