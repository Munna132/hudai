<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @keyframes slidein {
        0% {
          left: 0;
          top: 0px;
          background-color: blue;
        }
        50% {
          left: 0;
          top: 100px;
          background-color: red;
        }
        100% {
          left: 800px;
          top: 0px;
          background-color: rgb(69, 190, 96);
        }
      }
      .stage {
        background-color: rgb(170, 213, 213);
        height: 200px;
        min-width: 800px;
        position: relative;
      }
      .stage:hover .ball {
        animation: slidein 3s ease-in-out infinite;
      }
      .ball {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background-color: rgba(224, 49, 49, 0.668);
        position: absolute;
        left: 0; /* Added */
        top: 0; /* Added */
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="ball"></div>
    </div>
  </body>
</html>
